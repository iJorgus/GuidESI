<!DOCTYPE HTML>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" type="text/css" href="reservas.css"> 
    <!-- Fuentes Outfit e Inter-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1 class="sr-only">Formulario de contacto</h1>
    </header>

            <form id="formReserva" name="formReserva" action="#" method="post"> <div class="campo">
                    <label for="nombre">Nombre completo</label> <input type="text" id="nombre" name="nombre_cliente" placeholder="Value"> </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Value"> </div>

                <div class="campo">
                    <label for="telefono">Telefono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Value"> </div>

                <div class="campo">
                    <span class="label-mock">Nombre del guia:</span>
                    <span id="guiaVisual" style="font-weight: bold; margin-left: 10px;"></span>
    
                    <select id="selectGuiaManual" style="display:none;">
                        <option value="" data-ciudad="" data-max="0">-- Selecciona Guía --</option>
                        <option value="Manuel Perez" data-ciudad="Barcelona" data-max="15">Manuel Perez</option>
                        <option value="Curro Jimenez" data-ciudad="Sevilla" data-max="10">Curro Jimenez</option>
                        <option value="Javier Millán" data-ciudad="Madrid" data-max="20">Javier Millán</option>
                        <option value="Lolo López" data-ciudad="Cádiz" data-max="12">Lolo López</option>
                    </select>

                    <input type="hidden" id="nombreGuia" name="nombre_guia" value="">
                    <input type="hidden" id="hiddenCiudad" name="guia_ciudad" value="">
                    <input type="hidden" id="maxPersonasHidden" value="">
                </div>

                <div class="campo">
                    <span class="label-mock">Ciudad:</span>
                    <span id="visualCiudad" style="font-weight: bold; margin-left: 10px;"></span>
    
                <select id="selectCiudadManual" style="display:none;">
                    <option value="">-- Todas las ciudades --</option>
                    <option value="Madrid">Madrid</option>
                    <option value="Barcelona">Barcelona</option>
                    <option value="Sevilla">Sevilla</option>
                    <option value="Valencia">Valencia</option>
                </select>
</div>

<div class="campo">
    <label for="personas">Numero personas</label>
    <input type="number" id="personas" name="personas" min="1" placeholder="Value" required>
    <input type="hidden" id="maxPersonasHidden" value="">
</div>

                <div class="campo-fecha">
                    <label for="dia">Fecha</label>
                    <div class="fila-fecha">
                        <input type="text" id="dia" name="dia" placeholder="DD" maxlength="2" aria-label="dia">
                        <input type="text" id="mes" name="mes" placeholder="MM" maxlength="2" aria-label="mes">
                        <input type="text" id="ano" name="ano" placeholder="YYYY" maxlength="4" aria-label="ano">
                    </div>
                </div>

                <div class="campo-hora">
                    <label for="hora">Hora</label>
                        <div class="fila-hora">
                        <input type="time" id="hora" name="hora">
                    </div>
                </div>

                <div class="contenedor-boton">
                    <button type="submit" id="btnReservar"> <span class="icono">✓</span> Reservar
                    </button>
                </div>
                
            </form>
    <footer>
    </footer>

    <script src="reservas.js"></script> </body>
</html>
