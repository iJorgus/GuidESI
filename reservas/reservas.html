<!DOCTYPE HTML>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" type="text/css" href="reservas.css"> 
</head>
<body>
    <header>
    </header>

    <section>
        <article> <form id="formReserva" name="formReserva" action="#" method="post"> <div class="campo">
                    <label for="nombre">Nombre completo</label> <input type="text" id="nombre" name="nombre" placeholder="Value"> </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Value"> </div>

                <div class="campo">
                    <label for="telefono">Telefono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Value"> </div>

                <div class="campo">
                    <label for="personas">Numero personas</label>
                    <input type="number" id="personas" name="personas" placeholder="Value"> </div>

                <div class="campo-fecha">
                    <label>Fecha</label>
                    <div class="fila-fecha">
                        <input type="text" id="dia" name="dia" placeholder="DD" maxlength="2">
                        <input type="text" id="mes" name="mes" placeholder="MM" maxlength="2">
                        <input type="text" id="anio" name="anio" placeholder="YYYY" maxlength="4">
                    </div>
                </div>

                <div class="contenedor-boton">
                    <button type="submit" id="btnReservar"> <span class="icono">✓</span> Reservar
                    </button>
                </div>
                
            </form>
        </article>
    </section>

    <footer>
    </footer>

    <script src="reservas.js"></script> </body>
</html>
